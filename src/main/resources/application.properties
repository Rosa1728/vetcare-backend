spring.application.name=vetcare

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
jwt.secret=${JWT_SECRET}

# Parche 06B: SMTP permanece deshabilitado hasta configurar un proveedor.
vetcare.correo.habilitado=${VETCARE_MAIL_ENABLED:false}
vetcare.correo.remitente=${VETCARE_MAIL_FROM:no-reply@vetcare.test}
# Se activa solo cuando se configura MAIL_HOST. Nunca guardar contraseñas en este archivo.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}

# Fotografías de historias: máximo 5 MB por archivo.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
