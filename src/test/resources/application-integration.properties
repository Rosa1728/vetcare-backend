# Cargado en lugar de application.properties: sin configuración ni credenciales personales.
spring.application.name=vetcare-integration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
VETCARE_BOOTSTRAP_ADMIN_ENABLED=false
vetcare.correo.habilitado=false
vetcare.correo.cron=-
vetcare.recordatorios.cron=-
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.test.web.servlet=OFF
logging.level.org.springframework.security=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.testcontainers=OFF
logging.level.com.github.dockerjava=OFF

vetcare.recuperacion.cron=-
