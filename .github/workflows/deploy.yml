name: VetCare CD - DonWeb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vetcare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.DONWEB_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DONWEB_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Desplegar VetCare
        run: |
          ssh -o BatchMode=yes vetcare-deploy@138.36.238.158 \
            'sudo -n /usr/local/sbin/vetcare-deploy'
